camera_name: camera
Camera:
  # 相机序列号
  serial_number: DB1418166
  # 相机内参文件 package://my_cameras/calibrations/${NAME}.yaml
  cam_info_url: package://hik_camera_driver/config/ost.yaml
  # 帧率
  frame_rate: 10.0

  # 时间戳标定帧数（取流后采集N帧计算设备时间与PC时间的偏移，标定期间不发布图像）
  calib_frame_count: 50
  # IQR离群值剔除倍数（默认1.5）
  calib_iqr_multiplier: 1.5

  # 时间戳来源：
  #   false = 相机硬件时间戳 (默认, 经 tick 频率标定对齐 PC 时钟)
  #   true  = LiDAR 共享内存时间戳 (软同步, 蹭 livox 驱动写入 /tmp/livox_timeshare 的 base_time)
  # 启用 true 时需保证 livox_ros_driver2 节点已在运行并已创建 timeshare 文件;
  # 若共享内存不可用或 LiDAR 尚未写入, 自动回退到相机硬件时间戳。
  # 注意：本参数仅控制 stamp 来源, 与下面的 Trigger (相机采集触发模式) 互不影响。
  use_lidar_timestamp: false

  # 触发模式
  Trigger: true
  # 触发源
  # 0:Line0
  # 1:Line1
  # 2:Line2
  # 3.Line3
  # 4:Counter0
  # 7:Software
  # 8:FrequencyConverter
  Tigger_line: 0
  # 触发上升沿、下降沿、高电平、低电平等
  # 0:RisingEdge
  # 1:FallingEdge
  # 2:LevelHigh
  # 3:LevelLow
  Trigger_action: 0
  # 触发延时 ≥0.0 ，单位 us
  Trigger_delay: 0.0
  Trigger_cache_enable: true

  # 自动曝光
  # 0:Off
  # 1:Once
  # 2:Continuous
  Exposure: 0
  # 曝光时间 ≥0.0 ，单位 us
  Exposure_time: 5000
  # 自动曝光时间上限
  ExposureTimeUp: 10000
  # 自动曝光时间下限
  ExposureTimeLow: 100
  # 程序控制曝光，仅当自动曝光设为手动时启用
  Exposure_control: true

  # 自动增益
  # 0:Off
  # 1:Once
  # 2:Continuous
  Gain_mode: 2
  # 增益值 ≥0.0 ，单位 dB
  Gain_value: 0.0

  # 数字偏移使能
  Digital_shift_mode: true
  # 数字偏移调节 ≥ 0.0
  Digital_shift: 3.0
  # 亮度 0 <= L <= 255
  brightneess: 70

  # Gamma 使能
  GammaEnable: true
  # 伽马调节
  Gamma_value: 1.0
  # Gamma 选择
  Gamma_selector: 1
